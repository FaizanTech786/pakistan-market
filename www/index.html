<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="/manifest.json"><title>Pakistan Market</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7f9;color:#18212f}header{background:#0f766e;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:800;font-size:22px;margin-right:auto}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#0f766e;color:#fff}.light{background:#fff;color:#0f766e}.danger{background:#fee2e2;color:#991b1b}.container{max-width:1200px;margin:25px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#115e59,#0f766e);color:white;border-radius:20px;padding:28px;margin-bottom:20px}.search{display:flex;gap:8px}.search input,.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d8dee7;border-radius:10px;background:#fff}.search input{border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0000000b}.card img{width:100%;height:180px;object-fit:cover;background:#e5e7eb}.pad{padding:14px}.price{font-size:19px;font-weight:800;color:#0f766e}.muted{color:#667085;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.box{background:#fff;border-radius:18px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:22px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{white-space:nowrap}.admin,.chat{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:12px}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:13px;border-radius:12px;font-size:13px}.messages{height:360px;overflow:auto;background:#f8fafc;border-radius:14px;padding:12px}.msg{max-width:78%;padding:10px 12px;border-radius:14px;margin:8px 0;background:#fff;border:1px solid #e5e7eb}.mine{margin-left:auto;background:#dcfce7}.msg small{display:block;color:#667085;margin-top:5px}.attach{display:block;margin-top:7px}.deal{border-left:4px solid #0f766e;padding-left:10px}@media(max-width:600px){.brand{font-size:18px}.hero{padding:20px}.search{flex-direction:column}.msg{max-width:90%}}</style></head><body><header><div class="bar"><div class="brand">🇵🇰 Pakistan Market</div><button class="btn light" onclick="toggleLang()" id="langBtn">اردو</button><button class="btn light" onclick="openLogin()" id="loginBtn">Login</button><button class="btn light" onclick="openSell()">+ Sell</button><button class="btn light" onclick="openChats()" id="chatBtn" style="display:none">Messages</button><button class="btn light" onclick="openAdmin()" id="adminBtn" style="display:none">Admin</button></div></header><main class="container"><section class="hero"><h1 data-i18n="hero">Buy & Sell in Pakistan</h1><p data-i18n="heroSub">A moderated marketplace. Every listing is reviewed by Pakistan Market before going live.</p><div class="search"><input id="q" data-i18n-placeholder="search" placeholder="Search products, cars, bikes, cities..." oninput="loadListings()"><button class="btn light" onclick="loadListings()" data-i18n="searchBtn">Search</button></div></section><div class="notice" id="notice"></div><div class="tabs" id="cats"></div><div id="listings" class="grid"></div></main><div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
let token=localStorage.getItem('pm_token'),me=JSON.parse(localStorage.getItem('pm_user')||'null'),cats=[],lang=localStorage.getItem('pm_lang')||'en',currentChat=null;const $=id=>document.getElementById(id);const T={en:{hero:'Buy & Sell in Pakistan',heroSub:'A moderated marketplace. Every listing is reviewed by Pakistan Market before going live.',search:'Search products, cars, bikes, cities...',searchBtn:'Search',login:'Login',sell:'+ Sell',messages:'Messages',admin:'Admin',notice:'Pakistan Market is not responsible for personal injury, financial loss, theft or fraud. Please take care of your belongings. By listing on Pakistan Market, you acknowledge this notice.',contact:'Contact Pakistan Market',approved:'Approved',pending:'Pending',reject:'Reject',approve:'Approve'},ur:{hero:'پاکستان میں خرید و فروخت',heroSub:'یہ ایک نگرانی والا مارکیٹ پلیس ہے۔ ہر لسٹنگ لائیو ہونے سے پہلے پاکستان مارکیٹ کی منظوری سے گزرے گی۔',search:'پروڈکٹس، گاڑیاں، بائیکس، شہر تلاش کریں...',searchBtn:'تلاش',login:'لاگ اِن',sell:'+ چیز فروخت کریں',messages:'پیغامات',admin:'ایڈمن',notice:'جانی نقصان، مالی نقصان، چوری یا فراڈ ہونے پر پاکستان مارکیٹ ذمہ دار نہیں ہو گی۔ اپنی چیز کا خیال رکھیں۔ پاکستان مارکیٹ میں لسٹ کرنے سے پہلے اس بات کو قبول کریں۔',contact:'پاکستان مارکیٹ سے بات کریں',approved:'منظور شدہ',pending:'زیرِ منظوری',reject:'مسترد',approve:'منظور کریں'}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}async function api(url,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function applyLang(){let t=T[lang];document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]||e.textContent);document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t[e.dataset.i18nPlaceholder]||e.placeholder);$('loginBtn').textContent=me?me.name:t.login;$('chatBtn').textContent=t.messages;$('adminBtn').textContent=t.admin;$('notice').textContent=t.notice;$('langBtn').textContent=lang==='en'?'اردو':'English';document.documentElement.lang=lang==='en'?'en':'ur';document.documentElement.dir=lang==='en'?'ltr':'rtl'}function toggleLang(){lang=lang==='en'?'ur':'en';localStorage.setItem('pm_lang',lang);applyLang();renderCats()}
async function init(){cats=await api('/api/categories');renderCats();applyLang();if(me&&me.role==='admin')$('adminBtn').style.display='block';if(me)$('chatBtn').style.display='block';loadListings()}function renderCats(){$('cats').innerHTML='<button class="btn light tab" onclick="loadListings()">All</button>'+cats.map(c=>`<button class="btn light tab" onclick="loadListings('${esc(c)}')">${esc(c)}</button>`).join('')}
async function loadListings(cat=''){let q=encodeURIComponent($('q').value);let a=await api('/api/listings?q='+q+'&category='+encodeURIComponent(cat));$('listings').innerHTML=a.length?a.map(card).join(''):'<p>No approved listings yet.</p>'}function card(x){return `<article class="card">${x.images?.[0]?`<img src="${x.images[0]}" alt="">`:''}<div class="pad"><div class="price">${esc(x.price)}</div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.category)} · ${esc(x.city)}</div><p>${esc(x.description).slice(0,130)}</p><button class="btn primary" onclick='view(${JSON.stringify(x)})'>View</button></div></article>`}
function view(x){show(`<h2>${esc(x.title)}</h2>${x.images?.length?`<div class="grid">${x.images.map(i=>`<img src="${i}" style="width:100%;height:180px;object-fit:cover;border-radius:10px">`).join('')}</div>`:''}<p class="price">${esc(x.price)}</p><p>${esc(x.description)}</p><p><b>${esc(x.category)}</b> · ${esc(x.city)}</p><p><b>${esc(T[lang].contact)}</b></p><div class="notice">${esc(T[lang].notice)}</div><br><button class="btn primary" onclick="startChat('${x.id}')">${esc(T[lang].contact)}</button> <button class="btn light" onclick="closeM()">Close</button>`)}
function openLogin(){show(`<h2>${lang==='ur'?'پاکستان مارکیٹ لاگ اِن':'Pakistan Market Login'}</h2><div class="field"><label>Email</label><input id="em" type="email"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="btn primary" onclick="login()">${T[lang].login}</button> <button class="btn light" onclick="openRegister()">${lang==='ur'?'اکاؤنٹ بنائیں':'Create account'}</button>`)}async function login(){try{let j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})});token=j.token;me=j.user;localStorage.setItem('pm_token',token);localStorage.setItem('pm_user',JSON.stringify(me));closeM();$('chatBtn').style.display='block';if(me.role==='admin')$('adminBtn').style.display='block';applyLang()}catch(e){alert(e.message)}}function openRegister(){show(`<h2>${lang==='ur'?'اکاؤنٹ بنائیں':'Create account'}</h2><div class="field"><label>Name</label><input id="rn"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Password</label><input id="rp" type="password"></div><button class="btn primary" onclick="register()">Register</button>`)}async function register(){try{await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('rn').value,email:$('re').value,password:$('rp').value})});alert('Account created. Please login.');openLogin()}catch(e){alert(e.message)}}
function openSell(){if(!token)return openLogin();show(`<h2>${lang==='ur'?'چیز لسٹ کریں':'Post a Listing'}</h2><div class="notice">${esc(T[lang].notice)}</div><div class="field"><label>Title</label><input id="lt"></div><div class="field"><label>Description</label><textarea id="ld" rows="4"></textarea></div><div class="field"><label>Price</label><input id="lp" placeholder="e.g. Rs 250,000"></div><div class="field"><label>Category</label><select id="lc">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>City</label><input id="ly" placeholder="Lahore"></div><div class="field"><label>Owner contact (private to Admin)</label><input id="ln"></div>${me.role==='admin'?'<label><input id="la" type="checkbox"> List this as a Pakistan Market-owned product</label>':''}<div class="field"><label>Images (up to 8)</label><input id="li" type="file" accept="image/*" multiple></div><button class="btn primary" onclick="sell()">Submit for Approval</button>`)}async function sell(){let f=new FormData();[['title','lt'],['description','ld'],['price','lp'],['category','lc'],['city','ly'],['phone','ln']].forEach(([a,b])=>f.append(a,$(b).value));if($('la'))f.append('ownerType',$('la').checked?'admin':'user');for(let x of $('li').files)f.append('images',x);try{await api('/api/listings',{method:'POST',body:f});alert('Listing submitted. Admin approval is required before it goes live.');closeM()}catch(e){alert(e.message)}}
async function startChat(listingId){if(!token)return openLogin();try{let c=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listingId})});closeM();openChat(c.id)}catch(e){alert(e.message)}}async function openChats(){if(!token)return openLogin();let cs=await api('/api/conversations');show(`<h2>${lang==='ur'?'گفتگو':'Messages'}</h2>${cs.length?cs.map(c=>`<div class="admin"><b>${esc(c.listing?.title||'Listing')}</b><div class="muted">${esc(c.buyerName)} · ${c.status}</div><button class="btn primary" onclick="openChat('${c.id}')">Open</button></div>`).join(''):'<p>No conversations.</p>'}<button class="btn light" onclick="closeM()">Close</button>`)}
async function openChat(id){currentChat=id;let cs=await api('/api/conversations');let c=cs.find(x=>x.id===id);if(!c){let all=await api('/api/admin/listings');return}let ms=await api('/api/conversations/'+id+'/messages');show(`<h2>${esc(c.listing?.title||'Conversation')}</h2><div class="muted">Pakistan Market Admin mediates this conversation. Buyer and seller contact details are not exposed to each other.</div><div class="messages" id="msgs">${ms.map(messageHtml).join('')}</div><form onsubmit="sendMsg(event)"><div class="field"><textarea id="mt" rows="2" placeholder="Type message..."></textarea></div><div class="field"><input id="mf" type="file" accept="image/*,audio/*,.pdf,.txt"></div><div class="row"><button class="btn primary">Send</button>${me?.role==='admin'?`<button type="button" class="btn light" onclick="createDeal('${id}')">Create Deal</button>`:''}<button type="button" class="btn light" onclick="openChats()">Back</button></div></form>`);scrollMsgs()}
function messageHtml(m){let mine=m.senderId===me?.id;return `<div class="msg ${mine?'mine':''}"><b>${mine?'You':(m.senderRole==='admin'?'Pakistan Market Admin':'Participant')}</b>${m.text?`<div>${esc(m.text)}</div>`:''}${m.attachment?(m.attachment.type.startsWith('image/')?`<img class="attach" src="${m.attachment.url}" style="max-width:100%;max-height:220px;border-radius:10px">`:m.attachment.type.startsWith('audio/')?`<audio class="attach" controls src="${m.attachment.url}"></audio>`:`<a class="attach" href="${m.attachment.url}" target="_blank">${esc(m.attachment.name)}</a>`):''}<small>${new Date(m.createdAt).toLocaleString()}</small></div>`}
function scrollMsgs(){let x=$('msgs');if(x)x.scrollTop=x.scrollHeight}async function sendMsg(e){e.preventDefault();let f=new FormData();f.append('text',$('mt').value);if($('mf').files[0])f.append('attachment',$('mf').files[0]);try{await api('/api/conversations/'+currentChat+'/messages',{method:'POST',body:f});openChat(currentChat)}catch(e){alert(e.message)}}
async function createDeal(id){let amount=prompt('Deal amount:', '');if(amount===null)return;try{await api('/api/deals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:id,amount,note:'Admin-mediated deal'})});alert('Deal created. Admin can now manage payment and confirmation.')}catch(e){alert(e.message)}}
async function openAdmin(){if(!token)return openLogin();try{let[s,l,u,cs,deals]=await Promise.all([api('/api/admin/stats'),api('/api/admin/listings'),api('/api/admin/users'),api('/api/conversations'),api('/api/deals')]);show(`<h2>Admin Dashboard</h2><div class="grid"><div class="admin"><b>Users</b><h2>${s.users}</h2></div><div class="admin"><b>Listings</b><h2>${s.listings}</h2></div><div class="admin"><b>Pending</b><h2>${s.pending}</h2></div><div class="admin"><b>Conversations</b><h2>${s.conversations}</h2></div><div class="admin"><b>Deals</b><h2>${s.deals}</h2></div></div><h3>Listings</h3>${l.map(x=>`<div class="admin"><b>${esc(x.title)}</b> · ${esc(x.city)} · ${esc(x.price)} <span class="status ${x.status}">${x.status}</span><div class="muted">Owner: ${esc(x.ownerName)}${x.phone?' · Private contact: '+esc(x.phone):''}</div><div style="margin-top:8px">${x.status!=='approved'?`<button class="btn primary" onclick="setStatus('${x.id}','approved')">Approve</button>`:''} ${x.status!=='rejected'?`<button class="btn danger" onclick="setStatus('${x.id}','rejected')">Reject</button>`:''} <button class="btn light" onclick="del('${x.id}')">Delete</button></div></div>`).join('')}<h3>Conversations</h3>${cs.map(c=>`<div class="admin"><b>${esc(c.listing?.title||'Listing')}</b><div class="muted">Buyer: ${esc(c.buyerName)} · Seller: ${esc(c.sellerName)} · ${c.status}</div><button class="btn primary" onclick="openChat('${c.id}')">Open Chat</button></div>`).join('')}<h3>Deals</h3>${deals.map(d=>`<div class="admin deal"><b>${esc(d.amount)}</b> · <span class="status ${d.status==='completed'?'approved':'pending'}">${esc(d.status)}</span><div class="row"><button class="btn light" onclick="dealStatus('${d.id}','payment_received')">Payment Received</button><button class="btn light" onclick="dealStatus('${d.id}','seller_confirmed')">Seller Confirmed</button><button class="btn primary" onclick="dealStatus('${d.id}','completed')">Complete</button><button class="btn danger" onclick="dealStatus('${d.id}','cancelled')">Cancel</button></div></div>`).join('')}<button class="btn light" onclick="closeM()">Close</button>`)}catch(e){alert(e.message)}}async function setStatus(id,status){await api('/api/listings/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});openAdmin();loadListings()}async function del(id){if(confirm('Delete listing?')){await api('/api/listings/'+id,{method:'DELETE'});openAdmin();loadListings()}}async function dealStatus(id,status){await api('/api/deals/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});openAdmin()}
init();
</script></body></html>
